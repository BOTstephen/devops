
name: employee-task-management

services:
  backend:
    image: niaym/employee-backend:v1
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://13.126.98.151:8080
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    image: niaym/employee-frontend:v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
